name: Verify source

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: ${{ runner.os }}-rust-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Check release build lifecycle
        run: python -m unittest discover -s scripts/tests -v
      - name: Check generated skills
        run: python scripts/render-skills.py --check
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Install native Rust test reporter
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146
          fallback: none
      - name: Test and verify kit hashes
        run: |
          New-Item -ItemType Directory -Force target/nextest/highgrade | Out-Null
          cargo nextest list --locked --message-format json | Set-Content -Encoding utf8 target/nextest/highgrade/list.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo nextest run --locked --profile highgrade
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate active specifications
        run: |
          $catalog = target/debug/highgrade.exe spec-list --root "$PWD" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $catalog.status -ne 'passed') { throw 'spec-list failed' }
          foreach ($change in ($catalog.measurements[0].changes | Where-Object { $_.technical -ne 'abandoned' })) {
            $validation = target/debug/highgrade.exe spec-validate --root "$PWD" --id $change.id | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $validation.status -ne 'passed') { throw "spec-validate failed: $($change.id)" }
          }
      - name: Verify executable scenario links
        run: |
          node scripts/source-scenarios.mjs check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/source-scenarios.mjs prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/debug/highgrade.exe trace --root "$PWD" --record target/nextest/highgrade/run.json | Set-Content -Encoding utf8 target/nextest/highgrade/trace.json
          if ($LASTEXITCODE -notin @(0, 2)) { exit $LASTEXITCODE }
          node scripts/source-scenarios.mjs verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check selective context with 100 and 200 specs
        run: node scripts/check-scenario-scale.mjs
      - name: Check scenario report reuse guard
        run: node scripts/check-scenario-reuse.mjs
      - name: Build release
        run: cargo build --release --locked
      - name: Check repository structure
        run: node scripts/check-repository.mjs
      - name: Inspect registered project context
        run: |
          $report = target/debug/highgrade.exe inspect --root "$PWD" | ConvertFrom-Json
          if ($LASTEXITCODE -notin @(0, 2)) { exit $LASTEXITCODE }
          if ($report.findings | Where-Object { $_.status -in @('failed', 'unknown') }) { throw 'inspect found failed or unknown project context' }
