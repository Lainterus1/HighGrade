name: Verify source

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: ${{ runner.os }}-rust-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
      - name: Check release build lifecycle
        run: python -m unittest discover -s scripts/tests -v
      - name: Check generated skills
        run: python scripts/render-skills.py --check
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Install native Rust test reporter
        uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.146
          fallback: none
      - name: Test and verify kit hashes
        run: python scripts/verify.py tests

      - name: Validate active specifications
        run: python scripts/verify.py specs

      - name: Verify executable scenario links
        run: python scripts/verify.py scenarios

      - name: Check selective context with 100 and 200 specs
        run: node scripts/check-scenario-scale.mjs
      - name: Check scenario report reuse guard
        run: node scripts/check-scenario-reuse.mjs
      - name: Build release
        run: cargo build --release --locked
      - name: Check repository structure
        run: node scripts/check-repository.mjs
      - name: Inspect registered project context
        run: python scripts/verify.py inspect
