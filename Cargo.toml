[package]
name = "highgrade"
version = "0.2.25"
edition = "2024"
rust-version = "1.89"
publish = false
description = "Portable High Grade workflow diagnostics and connection"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
pulldown-cmark = { version = "=0.13.0", default-features = false }
roxmltree = "=0.20.0"
schemars = "=1.2.2"

[profile.dev]
debug = "line-tables-only"
incremental = false

